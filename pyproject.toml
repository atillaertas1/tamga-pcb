[project]
name = "pcbmcp"
version = "0.1.0"
description = "Token-efficient MCP server for AI-assisted PCB design with KiCad"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
pcbmcp = "pcbmcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pcbmcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
