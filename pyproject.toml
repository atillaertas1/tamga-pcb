[project]
name = "tamga-pcb"
version = "0.1.0"
description = "Token-efficient MCP server for AI-assisted PCB design with KiCad"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Atilla" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/atillaertas1/tamga-pcb"
Issues = "https://github.com/atillaertas1/tamga-pcb/issues"

[project.optional-dependencies]
# AGPL-3.0; kept optional and invoked as a subprocess so tamga-pcb itself stays MIT.
lcsc = ["easyeda2kicad>=1.0.1"]

[project.scripts]
tamga = "tamga_pcb.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tamga_pcb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
