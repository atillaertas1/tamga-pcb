name: Feature request
description: Suggest a new tool, part support, export format or workflow improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Not sure yet if it's a good fit? Start a thread in
        [Discussions](https://github.com/atillaertas1/tamga-pcb/discussions) first.

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: The board or workflow you were working on and where tamga-pcb got in the way.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
      description: The tool, option or behavior you have in mind.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Workarounds you use today, or other ways this could be solved.

  - type: checkboxes
    id: contribute
    attributes:
      label: Contributing
      options:
        - label: I'd like to open a pull request for this.
