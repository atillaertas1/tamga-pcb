name: CI

on:
  push:
  pull_request:

jobs:
  unit:
    # KiCad'siz testler her işletim sisteminde (KiCad gerektirenler kendiliğinden atlanır)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra lcsc
      - run: uv run pytest -q -rs

  kicad:
    # Linux'ta KiCad 10 ile tam test (DRC/ERC, pcbnew worker, autoroute)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra lcsc
      - run: uv run pcbmcp doctor --fix
      - run: uv run pytest -q -rs
