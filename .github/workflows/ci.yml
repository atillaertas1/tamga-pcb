name: CI

on:
  # Branch'lerde PR çalışması yeter; push yalnızca main'de (aksi halde her PR iki kez koşar)
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "assets/**", ".github/ISSUE_TEMPLATE/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "assets/**", ".github/ISSUE_TEMPLATE/**"]

# Aynı PR'a yeni commit gelince eskisini iptal et; main'deki çalışmalar tamamlansın
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  unit:
    # KiCad'siz testler her işletim sisteminde (KiCad gerektirenler kendiliğinden atlanır)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra lcsc
      - run: uv run pytest -q -rs

  kicad:
    # Linux'ta KiCad 10 ile tam test (DRC/ERC, pcbnew worker, autoroute)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
      - name: Install KiCad 10
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad kicad-symbols kicad-footprints
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --extra lcsc
      # doctor creates KiCad's global lib tables before the tests, so parallel workers don't race on them
      - run: uv run tamga doctor --fix
      # KiCad tests are many 2-10 s subprocess runs; one worker per CPU (pytest-xdist)
      - run: uv run pytest -q -rs -n auto
